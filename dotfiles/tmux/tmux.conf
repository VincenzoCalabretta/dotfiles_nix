set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"

set -s escape-time 0

setw -g aggressive-resize on

#-- Behaviour
set -g base-index 1
setw -g pane-base-index 1

bind-key R refresh-client \; display-message "Refresh client"

#-- Change prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

#-- appearance
set -g status-style 'bg=#333333 fg=#5eacd3'

#-- keybinding for vim mode
unbind [
bind \' copy-mode

set -g mouse on
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Change current pane to next window
bind-key '!' join-pane -t :1
bind-key '@' join-pane -t :2
bind-key '#' join-pane -t :3
bind-key '$' join-pane -t :4
bind-key '%' join-pane -t :5
bind-key '^' join-pane -t :6
bind-key '&' join-pane -t :7
bind-key '*' join-pane -t :8
bind-key '(' join-pane -t :9
bind-key ')' join-pane -t :10

# Choose Window
bind-key w choose-window

bind -r T neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.config/todo.md"

# set toggle of zoom
bind-key g resize-pane -Z

# keybindings for panel handling
bind-key z split-window -h -c "#{pane_current_path}"
bind-key x split-window -v -c "#{pane_current_path}"

bind-key q kill-pane
bind-key ? list-keys

# Config Reloads
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Switch active X output (Shift+P). Two monitors → auto-switch to the other,
# more than two → pick with fzf inside the popup.
bind-key P display-popup -E "randr_toggle_displays.py"

# tmux sessionizer
bind-key -r f display-popup -E "tmux-sessionizer"

# ---- Custom commands ----
bind-key -r i run-shell "tmux neww tmux-cht.sh"

# ---- graphical improvements ----
# avoid session name being cut off
set -g status-left-length 20

#nvim
set-option -g focus-events on
# to allow display of images in the terminal
set -g allow-passthrough on
