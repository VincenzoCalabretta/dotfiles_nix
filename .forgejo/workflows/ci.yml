name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

# This repo ships only the reusable module library (nixosModules,
# homeManagerModules.base) plus generic example/check outputs — no personal
# hosts or private inputs. `nix flake check` alone (home-manager-build
# against the placeholder "example" profile, deploy-tools, checklist-vm)
# proves the whole thing evaluates and activates. The concrete personal
# deployment (hosts, private local-AI stack) has its own CI in the private
# overlay repo.
jobs:
  checks:
    runs-on: [self-hosted]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: nix flake check 2>&1 | tail -40
